version: 2

models:
  - name: jobs_upcoming_v1
    description: >
      Public serving contract: jobs scheduled in the next 10 days, one row per
      job, for Operations. entity_id + synced_at present; RLS-scoped by entity_id.
      Catalogued in serving_catalog.md. Grain: (source_instance_id, external_job_id).
    columns:
      - name: job_key
        description: Stable unique row id (source_instance_id + external_job_id).
        data_tests: [not_null, unique]
      - name: entity_id
        description: Business entity (RLS key). Consumers only ever see their own.
        data_tests: [not_null]
      - name: external_job_id
        description: SmartMoving job id (unique within its instance).
        data_tests: [not_null]
      - name: service_date
        description: Local date the job is scheduled for.
        data_tests: [not_null]
      - name: synced_at
        description: When this row's source data was last extracted (freshness).
        data_tests: [not_null]
      - name: status
        description: Opportunity status label (Booked/Closed/status_N).

  - name: leads_today_v1
    description: >
      Public serving contract: leads created today (entity-local date), one row
      per lead, for Sales. entity_id + synced_at present; RLS-scoped by entity_id.
      Catalogued in serving_catalog.md. Grain: (source_instance_id, external_lead_id).
    columns:
      - name: lead_key
        description: Stable unique row id (source_instance_id + external_lead_id).
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: external_lead_id
        data_tests: [not_null]
      - name: created_at_utc
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]
      - name: lead_disposition
        description: New / In Progress / Lost / Bad Lead (derived from reasons).

  - name: sales_agent_daily_v1
    description: >
      PUBLIC CONTRACT. Sales performance per agent, line of business and lead-arrival
      day - a cohort grain. Recent cohorts are not comparable to old ones; read
      open_leads beside conversion_pct.
    columns:
      - name: agent_day_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_agent_leads_daily')
              field: agent_day_key
      - name: entity_id
        data_tests: [not_null]
      - name: agent_name
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: provisional_line_leads
        description: >
          Of leads_received, how many still have their line of business inferred from
          the branch because the lead has not converted to a job yet. Non-zero only on
          recent cohorts.
        data_tests: [not_null]
      - name: lead_received_date
        data_tests: [not_null]
      - name: leads_received
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: lead_source_daily_v1
    description: >
      PUBLIC CONTRACT. Lead volume, quality and conversion per marketing channel,
      line of business and lead-arrival day. Same cohort grain and maturity caveat.
      '(unmapped)' is a real channel bucket - do not filter it away.
    columns:
      - name: source_day_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_lead_source_daily')
              field: source_day_key
      - name: entity_id
        data_tests: [not_null]
      - name: channel_group
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: lead_received_date
        data_tests: [not_null]
      - name: leads_received
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: pipeline_current_v1
    description: >
      PUBLIC CONTRACT. The live pipeline, one row per unresolved opportunity. A
      snapshot of now, not a time series. Never sum estimated_final_total across
      committed and speculative rows together.
    columns:
      - name: opportunity_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_pipeline_current')
              field: opportunity_key
      - name: entity_id
        data_tests: [not_null]
      - name: status_category
        data_tests: [not_null]
      - name: is_committed
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: cancellations_daily_v1
    description: >
      PUBLIC CONTRACT. Cancellations on the day they happened, per agent and line of
      business. This is the PERIOD view and it publishes no rate - for a cancellation
      rate use sales_agent_daily_v1.cancellation_pct, which is keyed on the lead's
      arrival date where the denominator is real. The two count the same cancellation
      on two different dates; do not sum them. Coverage starts 2026-01-02.
    columns:
      - name: cancellation_day_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_cancellations_daily')
              field: cancellation_day_key
      - name: entity_id
        data_tests: [not_null]
      - name: agent_name
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: cancelled_date
        data_tests: [not_null]
      - name: cancellations
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: opportunities_v1
    description: >
      PUBLIC CONTRACT. One row per opportunity with identity, outcome, dates, money and
      attribution. Deliberately narrow - 39 of core's 60 columns - because a public
      contract is cheap to widen and expensive to narrow. Excludes deleted rows and
      prior-tenant rows (is_in_scope = false); the latter are another company's data
      and must not appear in a public contract. A null cancelled_date does not mean
      not cancelled - read is_cancelled. A null quote_number is a pending crosswalk,
      not a missing opportunity.
    columns:
      - name: opportunity_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('opportunities')
              field: opportunity_key
      - name: entity_id
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: agent_name
        description: Canonical roster name, or the CRM spelling if unrostered. Null where the CRM assigned no one.
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: status_category
        data_tests: [not_null]
      - name: is_booked
        data_tests: [not_null]
      - name: is_cancelled
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]
