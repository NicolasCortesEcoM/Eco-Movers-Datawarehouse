version: 2

models:
  - name: int_opportunity_observations
    description: >
      Every observation any source has made about an opportunity. One row =
      "source S said this about opportunity O at time T". Wide and nullable on
      purpose: a source contributes NULL for fields it does not know, and
      pick_latest skips nulls, which is what lets a report add invoiced_amount
      without erasing the API's estimated_total. Nothing is resolved here.
    columns:
      - name: opportunity_key
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              values: ['api_enrichment', 'api_webhook', 'api_sweep', 'api_deletion',
                       'report_lead_status', 'report_booked_opps']
      - name: observed_at
        data_tests: [not_null]
      - name: source_priority
        description: Tie-breaker when two sources share an observed_at. Lower wins.
        data_tests: [not_null]

  - name: int_opportunity_latest_by_source
    description: >
      Newest observation per (opportunity, source). The fan-in point every field in
      core.opportunities reads through; materialized as a table for that reason.
    columns:
      - name: opportunity_key
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]

  - name: int_job_observations
    description: >
      Every observation any source has made about a job. Same shape and rules as
      int_opportunity_observations. The report_all_jobs arm contributes only the
      fields that OVERLAP with an API source; its ~60 exclusive fields go through
      int_report_all_jobs_latest, because pick_latest earns its complexity only
      where two sources can disagree.
    columns:
      - name: job_key
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values: {values: ['api_enrichment', 'api_sweep', 'report_all_jobs']}
      - name: observed_at
        data_tests: [not_null]

  - name: int_job_latest_by_source
    description: Newest observation per (job, source). Fan-in point for core.jobs.
    columns:
      - name: job_key
        data_tests: [not_null]

  - name: int_report_all_jobs_latest
    description: >
      Newest All Jobs report row per job. Carries the ~60 fields no other source
      has - structured addresses, the actual cost breakdown, lifecycle dates - and
      joins straight into core.jobs rather than through the observation layer.
    columns:
      - name: job_key
        data_tests: [not_null, unique]
      - name: external_job_id
        data_tests: [not_null]

  - name: int_opportunity_quote_crosswalk
    description: >
      (source_instance_id, quote_number) -> external_opportunity_id. The bridge every
      Quote#-keyed scheduled report needs in order to attach to anything. Built from
      API sources only; a report must resolve against the API, never against another
      report. The composite key is mandatory - quote numbers are unique only within
      an instance.
    columns:
      - name: quote_key
        description: Grain key, source_instance_id:quote_number.
        data_tests: [not_null, unique]
      - name: source_instance_id
        data_tests: [not_null]
      - name: quote_number
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: resolved_at
        data_tests: [not_null]

  - name: int_report_lost_leads_latest
    description: >
      Newest Lost Leads report row per opportunity. Carries WHY a deal was lost, WHEN,
      and how long the customer waited for a first reply - three fields with exactly
      one source in the warehouse, so they join straight into core.opportunities
      rather than through the observation layer. Same rule as
      int_report_all_jobs_latest: pick_latest earns its complexity only where two
      sources can disagree. `Move Date` is the exception and is resolved in
      core.opportunities, because service_date genuinely does have competing sources.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]

  - name: int_opportunity_line
    description: >
      One line of business per opportunity, collapsed from its jobs. `min` is a
      deterministic tie-break, not a judgement - five opportunities out of 15,028
      span two lines, and has_mixed_lines records that a choice was made. Shared by
      fct_agent_leads_daily and fct_lead_source_daily so the tie-break exists once.
    columns:
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: has_mixed_lines
        data_tests: [not_null]
