version: 2

models:
  - name: int_opportunity_observations
    description: >
      Every observation any source has made about an opportunity. One row =
      "source S said this about opportunity O at time T". Wide and nullable on
      purpose: a source contributes NULL for fields it does not know, and
      pick_latest skips nulls, which is what lets a report add invoiced_amount
      without erasing the API's estimated_total. Nothing is resolved here.
    columns:
      - name: opportunity_key
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              values: ['api_enrichment', 'api_leads', 'api_webhook', 'api_sweep',
                       'api_deletion', 'report_lead_status', 'report_booked_opps']
      - name: observed_at
        data_tests: [not_null]
      - name: source_priority
        description: Tie-breaker when two sources share an observed_at. Lower wins.
        data_tests: [not_null]

  - name: int_opportunity_latest_by_source
    description: >
      Newest observation per (opportunity, source). The fan-in point every field in
      core.opportunities reads through; materialized as a table for that reason.
    columns:
      - name: opportunity_key
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]

  - name: int_job_observations
    description: >
      Every observation any source has made about a job. Same shape and rules as
      int_opportunity_observations. The report_all_jobs arm contributes only the
      fields that OVERLAP with an API source; its ~60 exclusive fields go through
      int_report_all_jobs_latest, because pick_latest earns its complexity only
      where two sources can disagree.
    columns:
      - name: job_key
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values: {values: ['api_enrichment', 'api_sweep', 'report_all_jobs']}
      - name: observed_at
        data_tests: [not_null]

  - name: int_job_latest_by_source
    description: Newest observation per (job, source). Fan-in point for core.jobs.
    columns:
      - name: job_key
        data_tests: [not_null]

  - name: int_report_all_jobs_latest
    description: >
      Newest All Jobs report row per job. Carries the ~60 fields no other source
      has - structured addresses, the actual cost breakdown, lifecycle dates - and
      joins straight into core.jobs rather than through the observation layer.
    columns:
      - name: job_key
        data_tests: [not_null, unique]
      - name: external_job_id
        data_tests: [not_null]

  - name: int_opportunity_quote_crosswalk
    description: >
      (source_instance_id, quote_number) -> external_opportunity_id. The bridge every
      Quote#-keyed scheduled report needs in order to attach to anything. Built from
      API sources only; a report must resolve against the API, never against another
      report. The composite key is mandatory - quote numbers are unique only within
      an instance.
    columns:
      - name: quote_key
        description: Grain key, source_instance_id:quote_number.
        data_tests: [not_null, unique]
      - name: source_instance_id
        data_tests: [not_null]
      - name: quote_number
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: resolved_at
        data_tests: [not_null]

  - name: int_report_lost_leads_latest
    description: >
      Newest Lost Leads report row per opportunity. Carries WHY a deal was lost, WHEN,
      and how long the customer waited for a first reply - three fields with exactly
      one source in the warehouse, so they join straight into core.opportunities
      rather than through the observation layer. Same rule as
      int_report_all_jobs_latest: pick_latest earns its complexity only where two
      sources can disagree. `Move Date` is the exception and is resolved in
      core.opportunities, because service_date genuinely does have competing sources.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]

  - name: int_report_payments_all
    description: >
      Every payment any Payments generation ever listed, once. ACCUMULATIVE: the export
      is a rolling 90-day window, so generations are unioned and deduplicated by
      transaction identity (instance, day, amount, target, method, instrument);
      user-editable fields take the newest generation's value; identical payments in
      one generation keep their multiplicity via dup_seq. Replaces
      int_report_payments_latest (2026-09-15), which forgot a payment the day it aged
      out of the window. Feeds core.payments.
    columns:
      - name: payment_key
        data_tests: [not_null, unique]
      - name: identity_hash
        data_tests: [not_null]
      - name: payment_date_local
        data_tests: [not_null]
      - name: first_observed_at
        data_tests: [not_null]

  - name: int_opportunity_line
    description: >
      One line of business per opportunity - every opportunity in core, not only the
      ones that have a job. The line is a property of the JOB, and SmartMoving does
      not create the job until the lead converts, so a fresh lead has nothing at job
      grain to read; that is what used to surface as `unassigned` on the agent
      dashboard. This model applies the same rule hierarchy as core.lines_of_business
      one grain up - jobs, then the opportunity's own branch via dim_lob_branch, then
      dim_instance.lob_hint, then `unassigned` - so a pre-conversion lead still lands
      on the right line. lob_source says which rule answered and is_provisional_line
      marks the inferences. Shared by fct_agent_leads_daily, fct_lead_source_daily and
      fct_pipeline_current so the tie-break and the hierarchy exist once.
    columns:
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: line_of_business
        description: >
          local, long_distance, commercial, or `unassigned` when the opportunity has
          neither a job nor a mapped branch. Never null.
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: has_mixed_lines
        data_tests: [not_null]
      - name: lob_source
        description: >
          Which rule decided the line: job (observed work), opportunity_branch,
          instance, or unassigned.
        data_tests:
          - not_null
          - accepted_values:
              values: ['job', 'opportunity_branch', 'instance', 'unassigned']
      - name: is_provisional_line
        description: >
          True while the opportunity has no job, so the line is an inference that the
          job will replace on conversion. Exclude or display it when comparing lines.
        data_tests: [not_null]

  - name: int_report_lead_status_latest
    description: >
      Newest Lead Status generation per opportunity, for Time to Contact - the one
      field that report carries for every outcome and no other free source does.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
