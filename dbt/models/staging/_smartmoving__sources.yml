version: 2

sources:
  - name: smartmoving
    schema: raw_smartmoving
    description: Raw SmartMoving payloads as loaded by dlt (dbt-only; no consumer reads this).
    tables:
      - name: customers_service_window
        description: Customer sweep by service-date window (the cheapest reconciliation call).
      - name: customers_service_window__opportunities
        description: Opportunities nested under the customer sweep (dlt child table).
      - name: customers_service_window__opportunities__jobs
        description: Jobs nested under each opportunity (dlt grandchild table).
      - name: dim_service_types
        description: Service-type reference list per instance.
      - name: dim_branches
        description: Branch reference list per instance.
      - name: leads
        description: Leads created in the polled date window.
      # --- Opportunity enrichment: GET /api/opportunities/{id} with all 10 Include*
      # flags, landed by dlt as a parent plus 12 child tables. This is the richest
      # data the warehouse holds. Child tables carry no instance stamp of their own -
      # dlt stamps only the root row - so every child model joins back up through
      # _dlt_parent_id / _dlt_root_id. Verified: those keys resolve 100% (765/765
      # jobs, 1458/1458 charges).
      - name: opportunities_enriched
        description: >
          Full opportunity payload per id. Grain (source_instance_id, id), verified
          unique. Carries the money (estimated_total__*), the custom pipeline status
          (lead_status), contacts, branch, tariff, estimator and sales assignee.
        columns:
          - name: lead_status
            description: >
              The custom pipeline status STRING - a different namespace from the
              `status` int. Arrives with inconsistent trailing whitespace: both
              'Booked' (283) and 'Booked ' (51) occur in the same column, so it must
              be trimmed before any grouping or join or booked counts run ~15% low.
          - name: quote_number
            description: >
              bigint here, but character varying on customers_service_window__opportunities.
              Cast to text on this side when joining the two.
      - name: opportunities_enriched__jobs
        description: Jobs under an enriched opportunity. job_date is a YYYYMMDD int (ISO string in the sweep).
      - name: opportunities_enriched__jobs__estimated_charges
        description: Quoted charge lines per job. Identical shape to actual_charges.
      - name: opportunities_enriched__jobs__actual_charges
        description: Billed charge lines per job. Identical shape to estimated_charges.
      - name: opportunities_enriched__payments
        description: >
          Payments recorded against the opportunity. No natural id in the payload,
          so the grain is (opportunity, _dlt_list_idx).
      - name: opportunity_deletions
        description: >
          Soft-delete markers. Raw never physically deletes: an opportunity that a
          COMPLETED sweep should have seen but did not, or that the detail endpoint
          answers 404 for, gets a marker here, and dbt treats a later enriched
          snapshot as "present again".

          Created by dlt only when the first deletion is detected, so it is absent
          on a fresh environment. int_opportunity_observations guards on the
          relation existing - but the guard alone was not enough: the model reads it
          through source(), which needs this declaration too. Missing it meant the
          build broke the very first time a deletion was ever detected (2026-08-13),
          having been green for weeks.

      # --- Scheduled reports, landed by n8n from email. Zero API quota.
      - name: report_all_jobs
        description: >
          The All Jobs report, JOB grain, 89 columns. The richest source in the
          warehouse and the only one carrying the job GUID, structured
          origin/destination, the full ACTUAL cost breakdown and lifecycle
          timestamps. The API equivalent is the Premium per-job endpoint, the most
          expensive call SmartMoving sells; this costs zero quota.
          SmartMoving cannot schedule this report itself. `pipeline/report_bot`
          controls the web UI and clicks Run Report only to make the email arrive;
          the common n8n `report_ingest` workflow downloads, validates and lands it.
          `Job Number` is `<quote>-<seq>`, a second independent path to the
          opportunity. See sql/30_report_landing.sql.
      - name: report_booked_opportunities
        description: >
          Booked Opportunities by Date Booked, OPPORTUNITY grain, 20 columns. Only
          three are promoted - invoiced amount, booked date and the customer contact.
          `Invoiced Amount` is the opportunity-grain realised-revenue total;
          estimated_final_total is a quote. All Jobs carries the same realised money
          at job grain, itemised in vendor columns misleadingly named `Actual * Cost`.
          See sql/31_report_booked_lost.sql.
      - name: report_lost_leads
        description: >
          Lost Leads report. Modelled by
          stg_smartmoving__report_lost_leads and int_report_lost_leads_latest, then
          joined into core.opportunities. It provides loss reason, lost date and
          time to first contact.
      - name: report_lead_status
        description: >
          THE MOST IMPORTANT REPORT. Keyed on lead RECEIVED date, so one export
          returns every lead and opportunity received in a period regardless of
          outcome - the denominator for any conversion rate. Carries the
          authoritative `Status` with its lost/cancelled subcategory. 16 columns;
          the sample export is 5,278 rows. See sql/33_report_lead_status.sql.

      - name: report_cancellations
        description: >
          Cancellation Details report. Landed and row-count verified by n8n. It is
          not yet promoted through a dbt staging/core model; the raw JSONB preserves
          cancelled date, amount and reason for that future work.

      - name: report_payments
        description: >
          Payments report. Landed and row-count verified by n8n. It is not yet
          promoted through dbt. Rows may attach to an opportunity, job or storage
          account, so a future core model must preserve that target discriminator.

      - name: webhook_events
        description: >
          SmartMoving webhook envelopes landed by n8n (Camino 1). One row per event;
          carries event_type + resource_id + raw payload. The opportunity status int
          rides inside payload->>'opportunity-status' for every opportunity-* event  - 
          a zero-API status feed. See sql/20_webhook_events.sql.
