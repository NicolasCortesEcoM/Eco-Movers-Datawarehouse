version: 2

# Staging for the opportunity-enrichment payload. Every grain claim below is
# tested, not asserted - these models are the foundation the observation layer and
# every money metric sit on, so an undetected fan-out here corrupts everything
# downstream.

models:
  - name: stg_smartmoving__opportunities_enriched
    description: >
      Enriched opportunities from GET /api/opportunities/{id} with all 10 Include*
      flags. Grain: (source_instance_id, external_opportunity_id). Renamed and typed
      only - no business logic.
    columns:
      - name: opportunity_key
        description: Grain key. Composite because SmartMoving GUIDs are unique only within an instance.
        data_tests: [not_null, unique]
      - name: source_instance_id
        data_tests:
          - not_null
          - accepted_values: {values: ['ld', 'local']}
      - name: entity_id
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: opportunity_dlt_id
        description: dlt row id; the join handle every child table uses.
        data_tests: [not_null, unique]
      - name: quote_number
        description: >
          Normalised to text. bigint at source here, varchar on the sweep - the
          crosswalk cannot join without this cast.
        data_tests:
          - unique:
              config:
                where: "quote_number is not null"
      - name: pipeline_status
        description: >
          The CRM's free-form pipeline label ("CMET", "Follow Up"). Context only -
          NEVER count metrics on it; it is independent of the outcome, so a Lost
          opportunity can still read 'Booked' here. Trimmed, because both 'Booked'
          and 'Booked ' occur at source and untrimmed they split into two values.
      - name: status_code
        description: >
          THE authoritative outcome. Int enum joined to dim_opportunity_status for
          labels and is_* flags. Verified identical to the sweep's status for all
          657 opportunities.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_opportunity_status')
              field: status_code
      - name: estimated_final_total
        description: >
          The money. 100% populated. Cast to `numeric` here at the staging
          boundary - dlt lands it as double precision, and binary floats drift
          under SUM. Every monetary column in this project is typed at this
          boundary, so nothing downstream re-casts and money is safe to aggregate
          from staging onward.
        data_tests: [not_null]
      - name: observed_at
        description: Snapshot time; the ordering key for the Phase 4 observation layer.
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: stg_smartmoving__opportunity_jobs
    description: "Jobs under an enriched opportunity. Grain: (source_instance_id, external_job_id)."
    columns:
      - name: job_key
        data_tests: [not_null, unique]
      - name: external_job_id
        data_tests: [not_null]
      - name: job_dlt_id
        data_tests: [not_null, unique]
      - name: external_opportunity_id
        description: Every job must resolve to its parent opportunity.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_smartmoving__opportunities_enriched')
              field: external_opportunity_id
      - name: job_date
        description: Local business date. Never timezone-converted.
        data_tests: [not_null]

  - name: stg_smartmoving__opportunity_job_charges
    description: >
      Estimated and actual charge lines in one model, separated by charge_kind.
      Grain: (source_instance_id, external_job_id, charge_kind, charge_seq).
    columns:
      - name: charge_key
        data_tests: [not_null, unique]
      - name: charge_kind
        data_tests:
          - not_null
          - accepted_values: {values: ['estimated', 'actual']}
      - name: external_job_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_smartmoving__opportunity_jobs')
              field: external_job_id
      - name: charge_category_code
        description: Int enum (observed 1,2,3,4,7,9,10). Unlabelled pending a verified seed.
        data_tests: [not_null]
      - name: total_cost
        description: "`numeric`, cast at this boundary like every monetary column."
        data_tests: [not_null]

  - name: stg_smartmoving__opportunity_payments
    description: >
      Payments per opportunity. Grain: (source_instance_id, external_opportunity_id,
      payment_seq) - the payload carries no payment id.
    columns:
      - name: payment_key
        data_tests: [not_null, unique]
      - name: amount
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_smartmoving__opportunities_enriched')
              field: external_opportunity_id

  - name: stg_smartmoving__branches
    description: Branch reference list, renamed and typed. Feeds core.branches.
    columns:
      - name: external_branch_id
        data_tests: [not_null, unique]
      - name: branch_name
        data_tests: [not_null]

  - name: stg_smartmoving__report_cancellations
    description: >
      The Cancellation Details report, typed. Carries `cancelled_date_local`, which
      exists in no other source in the warehouse - "cancelled" without a date cannot
      be trended or compared against the booking it undid. All generations kept;
      collapsing to the newest is the observation layer's job.
    columns:
      - name: report_row_key
        description: (instance, row_key, generation) - unique per landed row.
        data_tests: [not_null, unique]
      - name: source_instance_id
        data_tests:
          - not_null
          - accepted_values: {values: ['ld', 'local']}
      - name: entity_id
        data_tests: [not_null]
      - name: report_generated_at
        data_tests: [not_null]
      - name: quote_number
        description: >
          The opportunity this cancellation belongs to. Nullable: the report has been
          seen to omit it, and dropping such a row would lose a real cancellation.

  - name: stg_smartmoving__report_payments
    description: >
      The Payments report, typed. The only per-payment record in the warehouse -
      core.opportunities.invoiced_amount is one total per opportunity, this is the
      transactions behind it.

      A payment attaches to an opportunity, a job, OR a storage account, and storage
      accounts are a third top-level entity with no opportunity at all. Measured on
      162,660 rows: 144,159 quote / 13,988 job / 18,501 storage / 0 none. Forcing them
      all under an opportunity id would silently drop 11% of the cash.
    columns:
      - name: report_row_key
        data_tests: [not_null, unique]
      - name: source_instance_id
        data_tests:
          - not_null
          - accepted_values: {values: ['ld', 'local']}
      - name: entity_id
        data_tests: [not_null]
      - name: payment_target
        description: >
          Which of the three entities this payment is against. 'unattached' must never
          appear - it means the report emitted a payment with no quote, job or storage
          account, which has never happened in 162,660 rows.
        data_tests:
          - not_null
          # WARN, not error, on purpose. An unattached payment is a real finding and
          # must be loud, but payments are not yet promoted into core, and a changed
          # vendor export should not take down the nightly build of the whole
          # warehouse over a report nothing depends on yet. Promote to error when a
          # core model starts reading this.
          - accepted_values:
              values: ['opportunity', 'job', 'storage_account']
              config:
                severity: warn
      - name: payment_amount
        description: Cast to numeric at this boundary, like all money in this project.
