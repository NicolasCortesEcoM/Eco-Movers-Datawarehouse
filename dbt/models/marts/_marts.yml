version: 2

models:
  - name: mart_unmatched_report_rows
    description: >
      Report rows from the newest generation that could not be attached to an API
      opportunity. Most are expected - the reports span far more history than the
      API sweep window - so the reason column matters more than the count.
    columns:
      - name: unmatched_key
        data_tests: [not_null, unique]
      - name: unmatched_reason
        data_tests:
          - accepted_values:
              values: ['no_quote_number', 'quote_not_in_api']
      - name: source_instance_id
        data_tests: [not_null]
      - name: entity_id
        data_tests: [not_null]

  - name: fct_agent_leads_daily
    description: >
      Sales performance per agent, per line of business, per day the lead ARRIVED.
      A cohort grain: every number on a row describes what became of the leads that
      reached that agent on that day, whenever the outcome happened. That is what
      makes conversion answerable - the leads and the bookings on any given calendar
      day belong to different populations, so an "activity" grain cannot produce a
      rate at all.

      Roll up by summing: overall conversion across lines is
      sum(booked_leads)/sum(valid_leads), which weights by volume rather than
      averaging the lines - an agent with 400 local leads and 2 commercial ones
      should not have those two count equally.

      CAUTION - recent cohorts read high. A lead received last week has not had time
      to be lost, so its cohort looks better than it will settle at. Read open_leads
      alongside any conversion figure, or exclude the most recent ~60 days.

      Lives in marts, not serving, deliberately: marts may change whenever an analyst
      needs it. It is promoted to a versioned serving view once an application
      actually depends on its shape.
    columns:
      - name: agent_day_key
        description: entity:agent:line:YYYYMMDD. Readable on purpose.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: agent_name
        description: Canonical name from core.agents, never the raw CRM string.
        data_tests: [not_null]
      - name: line_of_business
        description: >
          From int_opportunity_line: the line of the opportunity's jobs, or - while it
          has none, because SmartMoving creates the job only on conversion - the line
          its branch maps to. `unassigned` means no job AND no mapped branch; those
          rows are kept rather than dropped so an agent's total still reconciles
          against core.opportunities. See provisional_line_leads.
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: provisional_line_leads
        description: >
          Of leads_received, how many have their line inferred from the branch because
          no job exists yet. Decays to zero as the cohort converts; non-zero only on
          the last few days. Show it beside any recent split by line of business.
        data_tests: [not_null]
      - name: lead_received_date
        data_tests: [not_null]
      - name: valid_leads
        description: The conversion denominator. Excludes bad leads, which were never winnable.
        data_tests: [not_null]
      - name: booked_leads
        data_tests: [not_null]
      - name: open_leads
        description: The maturity signal. A cohort with open leads has not finished settling.
        data_tests: [not_null]
      - name: conversion_pct
        description: >
          booked_leads / valid_leads. NULL rather than 0 when there is no denominator,
          so an empty day cannot average into a report as a real 0% performance.
      - name: is_sales_agent
        description: false for shared CRM accounts. Filter on it; they are flagged, not dropped.
        data_tests: [not_null]
      - name: is_within_assignment
        description: >
          Whether the lead landed in a line dim_agent_assignment says the agent covers
          on that date. A signal, never a filter: a run of false means the roster is
          stale or work is being routed somewhere unexpected.
        data_tests: [not_null]
      - name: synced_at
        description: Inherited from the underlying opportunities, not the build time.
        data_tests: [not_null]
      - name: invoiced_deals
        description: >
          Booked deals that carry a realised invoice figure. The denominator for
          avg_invoiced_deal_size - never divide by booked_leads, which counts deals
          not yet billed.
        data_tests: [not_null]
      - name: avg_invoiced_deal_size
        description: >
          Realised revenue per billed deal. Deliberately NOT based on
          estimated_final_total: that column is never null but is zero on 45% of
          booked opportunities, so averaging it reports $1,151 against a true $2,085.
      - name: lost_to_competitor
        description: From dim_status_map's subcategory, joined for the first time on 2026-09-08.
        data_tests: [not_null]
      - name: lost_on_price
        data_tests: [not_null]
      - name: lost_no_contact
        data_tests: [not_null]
      - name: lost_reason_unknown
        description: >
          Lost with no subcategory resolved - 913 of 20,770 lost opportunities (4.4%)
          on 2026-09-08. A rise means the CRM emitted a status string dim_status_map
          does not know, and the seed needs a row.
        data_tests: [not_null]
  - name: fct_lead_source_daily
    description: >
      Lead quality and conversion by marketing channel. Grain:
      (entity_id, channel_group, line_of_business, lead_received_date) - a COHORT
      row, same as fct_agent_leads_daily: it describes what became of the leads that
      arrived on that day, whenever the outcome landed.

      Recent cohorts are not comparable to old ones; read open_leads beside any
      conversion figure. Excludes prior-tenant rows via core.opportunities.is_in_scope.

      This is where marketing spend attaches when it arrives: cost per lead, CAC and
      ROAS become joins onto this table at (date, channel), not new models.
    columns:
      - name: source_day_key
        description: Grain key. Readable concatenation, not a hash.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: channel_group
        description: >
          Marketing channel, or '(unmapped)' where the CRM referral source is not in
          dim_referral_source. Unmapped is a real bucket carrying ~6,200 in-scope
          opportunities - never filter it away silently.
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: lead_received_date
        data_tests: [not_null]
      - name: leads_received
        data_tests: [not_null]
      - name: booked_leads
        data_tests: [not_null]
      - name: invoiced_deals
        data_tests: [not_null]
      - name: conversion_pct
        description: >
          Against VALID leads, not everything received. Null when there is no
          denominator - a zero would average into a report as a real 0%.
      - name: synced_at
        data_tests: [not_null]

  - name: fct_pipeline_current
    description: >
      The live pipeline: one row per unresolved opportunity (open or booked) as of the
      last build. A SNAPSHOT, not a time series - rebuilt from scratch every run.

      Committed work (is_committed) and speculative work (is_speculative) are reported
      separately and must never be summed into a single pipeline value. There is no
      probability-weighted forecast column on purpose.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: status_category
        description: Only unresolved categories reach this model.
        data_tests:
          - not_null
          - accepted_values: {values: ['open', 'booked']}
      - name: is_committed
        data_tests: [not_null]
      - name: is_speculative
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: fct_cancellations_daily
    description: >
      Cancellations counted on the day they HAPPENED. Grain:
      (entity_id, agent_name, line_of_business, cancelled_date) - a PERIOD row, and
      deliberately not a cohort one. The leads behind a row arrived across many
      earlier months; oldest_lead_cancelled and newest_lead_cancelled show the spread.

      The companion is fct_agent_leads_daily.cancellation_pct, which is keyed on the
      day the lead ARRIVED and is where a cancellation RATE is answerable, because
      that is the only grain whose denominator - the deals that could have cancelled -
      is knowable. No rate is published here for that reason. The same cancellation
      appears in both models on two different dates; summing them double counts.

      Coverage starts 2026-01-02, the first day of the Cancellation Details report
      window, so this model holds the 1,476 cancellations with a known date out of the
      6,331 in core. The cohort view counts all 6,331 because the cancelled flag comes
      from the status integer, not from the report. Excludes prior-tenant rows via
      core.opportunities.is_in_scope.
    columns:
      - name: cancellation_day_key
        description: Grain key. Readable concatenation, not a hash.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: agent_name
        description: >
          Canonical roster name, or the raw CRM name when unrostered, or 'unassigned'.
          Never dropped - a cancellation with no owner is still a loss.
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: cancelled_date
        data_tests: [not_null]
      - name: cancellations
        description: Count of deals cancelled on this date. Always >= 1.
        data_tests: [not_null]
      - name: cancelled_value
        description: >
          What the jobs were worth when they died, as stated on the cancellation.
          Distinct from invoiced_value_at_cancellation, which is what was billed.
      - name: synced_at
        data_tests: [not_null]

  - name: fct_campaign_daily
    description: >
      Lead outcomes per marketing campaign at two levels - the individual campaign and
      the family it rolls up to - on a cohort grain
      (entity_id, campaign_group, campaign, line_of_business, lead_received_date).
      The table marketing spend attaches to, because cost arrives per campaign.

      Built for the per-lead cost split. campaign_day_leads_total is what the campaign
      produced across all lines that day, so a row takes leads_received divided by
      campaign_day_leads_total of the campaign spend, and the shares sum back to the
      spend exactly. Commercial campaigns are measured by their campaign row, not by
      line, as a reporting choice - nothing here special-cases them.
    columns:
      - name: campaign_day_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: campaign_group
        data_tests: [not_null]
      - name: campaign
        data_tests: [not_null]
      - name: line_of_business
        data_tests: [not_null]
      - name: lead_received_date
        data_tests: [not_null]
      - name: leads_received
        data_tests: [not_null]
      - name: campaign_day_leads_total
        description: The campaign leads across all lines that day. Never less than leads_received.
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: int_ad_spend_daily
    description: >
      Every ad platform's spend, one row per platform campaign per day, with the CRM
      source it maps to via dim_ad_campaign_map (by id, within validity dates) or null.
      The single place spend is unioned and mapped, so fct_campaign_spend_daily and
      mart_unmapped_ad_spend are exact complements.
    columns:
      - name: spend_key
        data_tests: [not_null, unique]
      - name: platform
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]

  - name: fct_campaign_spend_daily
    description: >
      Ad spend attributed to CRM campaigns and lines of business by the per-lead rule
      (spend x leads_received / campaign_day_leads_total), with the leads and revenue it
      bought. Source of cost_per_lead, cost_per_acquisition and cost_efficiency_ratio.
      Spend on a day with no lead from the campaign lands whole on line 'unassigned'
      with has_leads = false. Grain (entity_id, campaign, line_of_business, spend_date).
      Reconciles to raw with mart_unmapped_ad_spend (tests/assert_ad_spend_reconciles).
    columns:
      - name: campaign_spend_day_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: campaign
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: spend_date
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]

  - name: mart_unmapped_ad_spend
    description: >
      Platform campaigns with spend and no row in dim_ad_campaign_map - the review
      queue, sorted by money. Every dollar here is absent from fct_campaign_spend_daily
      until Nicolas adds one CSV row per campaign id.
    columns:
      - name: unmapped_key
        data_tests: [not_null, unique]
      - name: unmapped_spend
        data_tests: [not_null]

  - name: int_cancellation_detail
    description: >
      One row per cancelled, in-scope opportunity with everything to cut a cancellation
      by: origin/destination geography of the primary job, reason, timing (lead to
      cancel, booking to cancel, cancel to move, late flag = within 48 h of the move),
      value, deposit paid, crew/truck/hours estimates, mileage band, and whether the
      customer booked again later. The base of both cancellation marts.
    columns:
      - name: opportunity_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('opportunities')
              field: opportunity_key
      - name: entity_id
        data_tests: [not_null]
      - name: cancellation_reason
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']

  - name: fct_cancellations_by_zip
    description: >
      Cancellations by origin ZIP WITH the denominator, on a cohort grain (entity, line,
      state, city, ZIP, month the lead arrived). cancellation_pct = cancellations /
      (booked + cancellations). Sum numerators and denominators to roll up; never
      average the row rates. Reasons as columns; late cancellations, deposits at risk
      and win-backs per ZIP. Filter booked_or_cancelled >= 20 before ranking by rate.
    columns:
      - name: zip_month_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: origin_zip
        data_tests: [not_null]
      - name: booked_or_cancelled
        data_tests: [not_null]
      - name: cancellations
        data_tests: [not_null]

  - name: fct_cancellation_reasons_monthly
    description: >
      Why customers cancel, by month the cancellation happened (period grain), line and
      reason. share_of_month_pct sums to 100 within (entity, line, month). Each reason
      carries how late it happens, what it costs, deposits held, win-backs, average
      mileage and estimated crew/hours. Reason coverage starts 2026-01-02 (the report's
      window); earlier cancellations have no date and are not here.
    columns:
      - name: reason_month_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: cancellation_reason
        data_tests: [not_null]
      - name: cancellations
        data_tests: [not_null]

  - name: int_first_contact_timing
    description: >
      One row per lead with a creation instant and a time-to-first-contact: wall-clock
      minutes, BUSINESS minutes (only the minutes inside the configurable sales window
      count - vars business_hours_start/_end/business_days), the response band and the
      outcome flags. Base of fct_first_contact_outcomes.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: business_minutes
        data_tests: [not_null]
      - name: response_band
        data_tests: [not_null]

  - name: fct_first_contact_outcomes
    description: >
      Outcomes by how fast the lead was answered, in business minutes: conversion,
      cancellation (cancelled / (booked + cancelled)) and lost rates per response band,
      split by whether the lead arrived inside business hours. Cohort by lead month.
      Read rows with >= 30 leads.
    columns:
      - name: contact_outcome_key
        data_tests: [not_null, unique]
      - name: leads
        data_tests: [not_null]

  - name: int_booking_detail
    description: >
      Every booking ever won with its booking date (job > Booked report > webhook; the
      source travels on the row), cancellation date, booking lead time and exposure.
      Base of the survival and lead-time marts.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: booked_date_source
        data_tests:
          - accepted_values:
              values: ['job', 'report', 'webhook', 'lead_proxy']

  - name: fct_booking_survival
    description: >
      Share of bookings still alive N days after being booked, and the hazard per
      window - the "when to call to reconfirm" curve. A booking counts at horizon h
      only if it had h days before the move and h days have elapsed. Cancellations
      without a date (pre-2026) are excluded from the curve and counted on the row.
      Sum at_risk and cancelled_by_horizon to roll up; never average the pcts.
    columns:
      - name: survival_key
        data_tests: [not_null, unique]
      - name: at_risk
        data_tests: [not_null]

  - name: fct_bookings_by_lead_time
    description: >
      Cancellation rate by how far ahead of the move the booking was made (Nicolas's
      hypothesis: older bookings cancel more). Complete 2023-2026; cancellations
      without a date still count.
    columns:
      - name: lead_time_month_key
        data_tests: [not_null, unique]
      - name: bookings
        data_tests: [not_null]
