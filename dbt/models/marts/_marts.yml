version: 2

models:
  - name: mart_unmatched_report_rows
    description: >
      Report rows from the newest generation that could not be attached to an API
      opportunity. Most are expected - the reports span far more history than the
      API sweep window - so the reason column matters more than the count.
    columns:
      - name: unmatched_key
        data_tests: [not_null, unique]
      - name: unmatched_reason
        data_tests:
          - accepted_values:
              values: ['no_quote_number', 'quote_not_in_api']
      - name: source_instance_id
        data_tests: [not_null]
      - name: entity_id
        data_tests: [not_null]

  - name: fct_agent_leads_daily
    description: >
      Sales performance per agent, per line of business, per day the lead ARRIVED.
      A cohort grain: every number on a row describes what became of the leads that
      reached that agent on that day, whenever the outcome happened. That is what
      makes conversion answerable - the leads and the bookings on any given calendar
      day belong to different populations, so an "activity" grain cannot produce a
      rate at all.

      Roll up by summing: overall conversion across lines is
      sum(booked_leads)/sum(valid_leads), which weights by volume rather than
      averaging the lines - an agent with 400 local leads and 2 commercial ones
      should not have those two count equally.

      CAUTION - recent cohorts read high. A lead received last week has not had time
      to be lost, so its cohort looks better than it will settle at. Read open_leads
      alongside any conversion figure, or exclude the most recent ~60 days.

      Lives in marts, not serving, deliberately: marts may change whenever an analyst
      needs it. It is promoted to a versioned serving view once an application
      actually depends on its shape.
    columns:
      - name: agent_day_key
        description: entity:agent:line:YYYYMMDD. Readable on purpose.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: agent_name
        description: Canonical name from core.agents, never the raw CRM string.
        data_tests: [not_null]
      - name: line_of_business
        description: >
          `unassigned` where the opportunity has no job and therefore no line. Those
          rows are kept so an agent's total still reconciles against
          core.opportunities.
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unassigned']
      - name: lead_received_date
        data_tests: [not_null]
      - name: valid_leads
        description: The conversion denominator. Excludes bad leads, which were never winnable.
        data_tests: [not_null]
      - name: booked_leads
        data_tests: [not_null]
      - name: open_leads
        description: The maturity signal. A cohort with open leads has not finished settling.
        data_tests: [not_null]
      - name: conversion_pct
        description: >
          booked_leads / valid_leads. NULL rather than 0 when there is no denominator,
          so an empty day cannot average into a report as a real 0% performance.
      - name: is_sales_agent
        description: false for shared CRM accounts. Filter on it; they are flagged, not dropped.
        data_tests: [not_null]
      - name: is_within_assignment
        description: >
          Whether the lead landed in a line dim_agent_assignment says the agent covers
          on that date. A signal, never a filter: a run of false means the roster is
          stale or work is being routed somewhere unexpected.
        data_tests: [not_null]
      - name: synced_at
        description: Inherited from the underlying opportunities, not the build time.
        data_tests: [not_null]
      - name: invoiced_deals
        description: >
          Booked deals that carry a realised invoice figure. The denominator for
          avg_invoiced_deal_size - never divide by booked_leads, which counts deals
          not yet billed.
        data_tests: [not_null]
      - name: avg_invoiced_deal_size
        description: >
          Realised revenue per billed deal. Deliberately NOT based on
          estimated_final_total: that column is never null but is zero on 45% of
          booked opportunities, so averaging it reports $1,151 against a true $2,085.
      - name: lost_to_competitor
        description: From dim_status_map's subcategory, joined for the first time on 2026-09-08.
        data_tests: [not_null]
      - name: lost_on_price
        data_tests: [not_null]
      - name: lost_no_contact
        data_tests: [not_null]
      - name: lost_reason_unknown
        description: >
          Lost with no subcategory resolved - 913 of 20,770 lost opportunities (4.4%)
          on 2026-09-08. A rise means the CRM emitted a status string dim_status_map
          does not know, and the seed needs a row.
        data_tests: [not_null]
  - name: fct_lead_source_daily
    description: >
      Lead quality and conversion by marketing channel. Grain:
      (entity_id, channel_group, line_of_business, lead_received_date) - a COHORT
      row, same as fct_agent_leads_daily: it describes what became of the leads that
      arrived on that day, whenever the outcome landed.

      Recent cohorts are not comparable to old ones; read open_leads beside any
      conversion figure. Excludes prior-tenant rows via core.opportunities.is_in_scope.

      This is where marketing spend attaches when it arrives: cost per lead, CAC and
      ROAS become joins onto this table at (date, channel), not new models.
    columns:
      - name: source_day_key
        description: Grain key. Readable concatenation, not a hash.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: channel_group
        description: >
          Marketing channel, or '(unmapped)' where the CRM referral source is not in
          dim_referral_source. Unmapped is a real bucket carrying ~6,200 in-scope
          opportunities - never filter it away silently.
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unclassified']
      - name: lead_received_date
        data_tests: [not_null]
      - name: leads_received
        data_tests: [not_null]
      - name: booked_leads
        data_tests: [not_null]
      - name: invoiced_deals
        data_tests: [not_null]
      - name: conversion_pct
        description: >
          Against VALID leads, not everything received. Null when there is no
          denominator - a zero would average into a report as a real 0%.
      - name: synced_at
        data_tests: [not_null]

  - name: fct_pipeline_current
    description: >
      The live pipeline: one row per unresolved opportunity (open or booked) as of the
      last build. A SNAPSHOT, not a time series - rebuilt from scratch every run.

      Committed work (is_committed) and speculative work (is_speculative) are reported
      separately and must never be summed into a single pipeline value. There is no
      probability-weighted forecast column on purpose.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: line_of_business
        data_tests:
          - not_null
          - accepted_values:
              values: ['local', 'long_distance', 'commercial', 'unclassified']
      - name: status_category
        description: Only unresolved categories reach this model.
        data_tests:
          - not_null
          - accepted_values: {values: ['open', 'booked']}
      - name: is_committed
        data_tests: [not_null]
      - name: is_speculative
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]
