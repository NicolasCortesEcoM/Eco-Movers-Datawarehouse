version: 2

models:
  - name: branches
    description: >
      Canonical branches, and THE TIMEZONE AUTHORITY (CLAUDE.md). Grain: one row
      per (source_instance_id, external_branch_id). Everything downstream that
      needs a local date resolves its zone here rather than hardcoding one.
      Carries the only free geocoded address the API exposes (dispatch lat/lng).
    columns:
      - name: branch_key
        description: Grain key, source_instance_id + external_branch_id.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: source_instance_id
        data_tests: [not_null]
      - name: external_branch_id
        data_tests: [not_null]
      - name: branch_name
        description: >
          Not a line-of-business signal. The `local` instance has a branch named
          "Long Distance Team" (decisions/0002) - use instance + service type.
        data_tests: [not_null]
      - name: timezone
        description: >
          IANA operating timezone: per-branch seed override, else the instance
          default. Drives operational local dates.
        data_tests: [not_null]
      - name: crm_timezone
        description: >
          IANA zone the SmartMoving instance renders in. What the scheduled-report
          "* at Utc" columns are actually in. NOT the same as `timezone`.
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: opportunities
    description: >
      Canonical opportunity. Grain: (source_instance_id, external_opportunity_id).
      Every field resolved independently by pick_latest across all sources that
      reported it - see dbt/macros/pick_latest.sql. Separate from core.leads by
      design; there is no lead->opportunity map in this phase.
      Status: status_code is authoritative, pipeline_status is context only.
    columns:
      - name: opportunity_key
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: source_instance_id
        data_tests:
          - not_null
          - accepted_values: {values: ['ld', 'local']}
      - name: external_opportunity_id
        data_tests: [not_null]
      - name: status_code
        description: The authoritative outcome int. Drives every is_* flag.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_opportunity_status')
              field: status_code
      - name: status_label
        data_tests: [not_null]
      - name: is_booked
        description: Real boolean. True for Booked, Completed and Closed.
        data_tests: [not_null]
      - name: synced_at
        description: Newest moment any source spoke about this opportunity.
        data_tests: [not_null]

      - name: is_in_scope
        description: >
          False when the row predates dim_instance.data_valid_from - i.e. it belongs
          to the business that used this SmartMoving account before us. The KPI marts
          filter on it; core keeps the rows so the exclusion stays visible.
        data_tests: [not_null]
      - name: referral_channel_group
        description: >
          Marketing channel from dim_referral_source - Paid Search, Paid Social, GBP,
          Organic, Referral, Affiliate, Direct, AI. Present on 90% of in-scope
          opportunities; null where the seed row exists but its channel is still blank
          (long-tail sources) or where the CRM value is not in the seed at all.
      - name: referral_platform
        description: Google | Meta | Bing | Yelp | Word of Mouth | Return, from the same seed.
      - name: referral_is_paid
        description: >
          True when the source needs marketing spend to produce the lead. NULL, not
          false, when the seed is silent - "unknown" and "free" are different answers
          and a ROI denominator must not conflate them.
      - name: referral_source_clean
        description: Tidied display name for the source. Group by channel or platform, not by this.
      - name: status_subcategory
        description: >
          Lost/cancelled/bad-lead subcategory from dim_status_map, e.g. lost_contact,
          lost_competitor, bad_duplicate. Nullable on purpose: it is null for the CRM
          pipeline labels the seed deliberately does not map (CMET, Follow Up,
          Tentative Booking) and for any report string not yet in the seed. 93.5% of
          in-scope opportunities carrying a pipeline_status resolve, measured 2026-09-08.
      - name: status_category_reported
        description: >
          The category the REPORT string implies. Kept beside status_category, which
          comes from the authoritative platform integer, rather than merged into it -
          where the two disagree that is a finding, not noise. Never group by this.

  - name: opportunity_payments
    description: >
      Payments per opportunity. Grain: (source_instance_id,
      external_opportunity_id, payment_seq) - the payload has no payment id.
    columns:
      - name: payment_key
        data_tests: [not_null, unique]
      - name: amount
        data_tests: [not_null]
      - name: external_opportunity_id
        data_tests:
          - not_null
          - relationships:
              to: ref('opportunities')
              field: external_opportunity_id

  - name: jobs
    description: >
      Canonical upcoming-jobs entity from the SmartMoving service-date sweep.
      Grain: one row per (source_instance_id, external_job_id). core is dbt-only
      plus read-only for app teams under an "unstable, may change" label.
    columns:
      - name: job_key
        description: Grain key, source_instance_id + external_job_id.
        data_tests: [not_null, unique]
      - name: entity_id
        description: Business entity that owns the row (RLS key).
        data_tests: [not_null]
      - name: source_instance_id
        data_tests: [not_null]
      - name: external_job_id
        data_tests: [not_null]
      - name: service_date
        description: Local business date of the job (never timezone-converted).
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]
      - name: is_in_scope
        description: >
          False when the row predates dim_instance.data_valid_from - i.e. it belongs
          to the business that used this SmartMoving account before us. The KPI marts
          filter on it; core keeps the rows so the exclusion stays visible.
        data_tests: [not_null]

  - name: leads
    description: >
      Canonical leads from the daily windowed poll. Grain: one row per
      (source_instance_id, external_lead_id). Disposition derived from reason
      fields. core is dbt-only + read-only for app teams (unstable).
    columns:
      - name: lead_key
        description: Grain key, source_instance_id + external_lead_id.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: external_lead_id
        data_tests: [not_null]
      - name: created_at_utc
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]

  - name: opportunity_charges
    description: >
      Charge lines per JOB, estimated and actual in one table separated by
      charge_kind. Despite the name this is job grain, not opportunity grain.

      THESE ARE REVENUE LINES, NOT COSTS. SmartMoving names them "cost" and the
      warehouse repeated that mistake until 2026-09-01. `charge_kind = 'actual'`
      sums to the same realised figure the All Jobs report calls
      `total_actual_cost`, which in turn equals `core.opportunities.invoiced_amount`
      - 2,552 of 2,554 single-job opportunities agree to the cent. The only true
      cost column in the warehouse is `core.jobs.wages`.

      Coverage is partial by design: charges only exist for opportunities that were
      enriched through the detail call, which is a deliberate minority. Where the
      API and the report disagree the REPORT is newer - the API rows are a snapshot
      from the moment the job closed.
    columns:
      - name: charge_key
        data_tests: [not_null, unique]
      - name: charge_kind
        data_tests:
          - not_null
          - accepted_values: {values: ['estimated', 'actual']}
      - name: charge_category_code
        description: >
          Derived from live data 2026-09-01 by correlating each category total against
          the All Jobs report columns:
          1 = moving labor (local hourly), 2 = transportation / line-haul (long
          distance), 3 = materials and packing, 4 = additional services,
          7 = valuation / replacement cost coverage, 9 = storage, 10 = shuttle.
          Codes 1 and 2 both land in the report's `actual_labor_cost`, because the
          main charge differs by job type.
      - name: entity_id
        data_tests: [not_null]

  - name: lines_of_business
    description: >
      The line of business of each job. Grain: (source_instance_id, external_job_id),
      one row per job, resolved from the instance hint and the branch->LOB seed.

      This model shipped with no entry here at all, so it had zero tests while
      feeding fct_agent_leads_daily - which does test line_of_business downstream.
      It also has no synced_at, unlike every other core table; that is a real gap,
      left alone here because adding it changes the model rather than its contract.
    columns:
      - name: job_key
        description: Stable row id, same key as core.jobs.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: source_instance_id
        data_tests:
          - not_null
          - accepted_values: {values: ['ld', 'local']}
      - name: external_job_id
        description: FK to core.jobs.
        data_tests:
          - not_null
          - relationships:
              to: ref('jobs')
              field: external_job_id
      - name: line_of_business
        data_tests: [not_null]
      - name: is_unclassified
        description: >
          True when no rule matched and line_of_business fell back to a default.
          207 of 63,441 rows on 2026-09-08 - watch it, do not gate on it.
        data_tests: [not_null]

  - name: agents
    # Grain is the PAIR (entity_id, source_agent_name), asserted by the singular test
    # tests/assert_agents_unique_per_entity.sql. Not a `unique` on source_agent_name:
    # that passes only while there is one entity.
    description: >
      The canonical sales roster: every salesperson name the CRM has written,
      resolved to one canonical person with a role and an active flag.
      Built from two seeds that are edited independently - dim_agent (who someone
      is) and dim_agent_assignment (which lines they cover, and when). A name seen
      in the CRM but missing from the seed is surfaced with is_known = false, never
      dropped.
    columns:
      - name: source_agent_name
        description: The raw CRM string. Join key from core.opportunities.sales_assignee_name.
        data_tests: [not_null]
      - name: agent_name
        description: Canonical name. Group by this, never by source_agent_name.
        data_tests: [not_null]
      - name: is_sales_agent
        data_tests: [not_null]
      - name: is_known
        description: false means the name needs adding to dbt/seeds/dim_agent.csv.
        data_tests: [not_null]

  - name: payments
    description: >
      Every payment the business has received, from the Payments scheduled report.
      Grain: one row per (source_instance_id, transaction identity, duplicate
      ordinal), accumulated across every report generation.

      NOT a replacement for opportunity_payments and not merged with it. That model
      holds payments embedded in the API's enriched opportunity payload - 1,965 rows,
      only the opportunities a detail call reached, but with a real GUID and ordinal.
      This one covers every payment in the report window at zero quota and carries what
      the API payload lacks: date, method, card confirmation, terminal, and payments
      made against a job or a storage account rather than an opportunity. There is no
      shared payment identifier to merge on, so merging them would either double count
      or invent a match.

      ACCUMULATIVE (2026-09-15). The export is a rolling 90-day window, so every
      generation is unioned and deduplicated by transaction identity (day, amount,
      target, method, instrument) in int_report_payments_all; user-editable fields take
      the newest generation's value. Nothing ages out. Refunds are the negative rows.
      A payment edited or voided inside the newest window is excluded (the newest
      export is the CRM's truth there); older history cannot age out.
    columns:
      - name: payment_key
        description: instance:identity_hash:dup_seq - stable across generations.
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: payment_target
        description: What the payment is against.
        data_tests:
          - not_null
          - accepted_values:
              values: ['opportunity', 'job', 'storage_account', 'unattached']
      - name: external_opportunity_id
        description: >
          Null where the quote has not been resolved to a GUID yet. Unattached
          payments are kept, never dropped - the money exists either way.
      - name: payment_amount
        data_tests: [not_null]
      - name: synced_at
        data_tests: [not_null]
