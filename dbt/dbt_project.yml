name: datawarehouse
version: "1.0.0"
config-version: 2

profile: datawarehouse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Business rules that are a NUMBER someone may want to change, not a modelling
# decision. Edit here, rebuild; no SQL changes.
vars:
  # Sales business hours, in the lead's branch-local time. A lead that arrives at
  # 9 pm is not "answered late" when it is called at 8:05 the next morning, so
  # time-to-first-contact is measured in BUSINESS minutes: only the minutes inside
  # this window count. Set by Nicolas 2026-09-15: 08:00-17:00. Hours are integers on
  # the 24 h clock; the window is [start, end).
  business_hours_start: 8
  business_hours_end: 17
  # ISO day numbers that count as business days: 1 = Monday ... 7 = Sunday.
  # Default: every day. Measured 2026-09-15 on 33,869 leads since 2025: leads that
  # arrive on Saturday are answered within the hour 64% of the time, on Sunday 61%,
  # weekdays 70% - the sales team works weekends, so a weekend day that counted as
  # zero business minutes would call a same-day reply "instant". Drop 6 and/or 7 here
  # if that ever changes.
  business_days: [1, 2, 3, 4, 5, 6, 7]
  # Booking-survival horizons, in days since the booking was made.
  survival_horizons: [1, 3, 7, 14, 21, 30, 45, 60, 90]

# dbt drops and recreates core/serving tables, which drops their RLS policies.
# Re-apply them in the same invocation - otherwise app_read can read every
# entity's rows until someone remembers to run sql/10_apply_rls.sql by hand.
on-run-end:
  - "{{ apply_rls() }}"

seeds:
  datawarehouse:
    +schema: staging      # hand-maintained dimensions live alongside staging views

    # EVERY SEED TABLE CARRIES A WARNING, IN THE DATABASE ITSELF.
    #
    # `dbt seed` DROPS AND RECREATES these tables on every build. A row typed
    # straight into Postgres is destroyed on the next run, silently, and dbt still
    # reports success - verified by inserting a row and watching it disappear.
    #
    # The warning lives as a Postgres COMMENT because that is the one place someone
    # about to edit the table will actually be looking: psql `\d+`, DBeaver, pgAdmin
    # and Metabase all surface it next to the table name. A note in a README is not
    # in front of the person holding the UPDATE statement.
    +post-hook: >
      comment on table {{ this }} is
      'HAND-MAINTAINED DIMENSION - DO NOT EDIT IN THE DATABASE.
      This table is dropped and recreated from dbt/seeds/{{ this.identifier }}.csv
      on every dbt build, so any change made here is destroyed silently at the next
      run. Edit the CSV in the repository instead; the change reaches every model
      that depends on it on the next build.'
    dim_instance:
      +column_types:
        instance_id: text
        entity_id: text
        timezone: text
        crm_timezone: text
    branch_timezone:
      +column_types:
        source_instance_id: text
        branch_name: text
        timezone: text
    # Platform ids are IDENTIFIERS, never numbers: a Google campaign id overflows
    # int4, and an account id with a leading zero would lose it. Text on both sides
    # of the join to raw_<platform>, which lands them as text too.
    dim_ad_campaign_map:
      +column_types:
        platform: text
        account_id: text
        platform_campaign_id: text
        platform_campaign_name: text
        crm_referral_source: text
        valid_from: date
        valid_to: date
        notes: text
    # The is_* flags are written as 0/1 in the CSVs (they came from spreadsheets).
    # Load them as real booleans so `where is_booked` just works - forcing every
    # consumer to remember `= 1` is exactly the kind of papercut that makes a
    # warehouse feel hostile to someone new to it.
    dim_opportunity_status:
      +column_types:
        status_code: integer
        sort_order: integer
        is_valid_lead: boolean
        is_booked: boolean
        is_completed: boolean
        is_cancelled: boolean
        is_lost: boolean
        is_bad_lead: boolean
        is_open: boolean
    dim_status_map:
      +column_types:
        is_valid_lead: boolean
        is_booked: boolean
        is_completed: boolean
        is_cancelled: boolean
        is_lost: boolean
        is_bad_lead: boolean
        is_open: boolean

# Layers map to Postgres schemas via the generate_schema_name macro (literal, not
# prefixed). raw is dlt-loaded; dbt owns staging -> core -> marts -> serving.
models:
  datawarehouse:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: marts       # dbt-owned, analytical, may change freely (like marts)
      +materialized: view
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    serving:
      +schema: serving
      +materialized: table   # table (not view) so RLS on entity_id applies to app_read
